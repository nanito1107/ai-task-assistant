events { worker_connections 1024; }

http {
    # ── Backend API ──────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    # ── Grafana ──────────────────────────────────────────────
    upstream grafana {
        server grafana:3000;
    }

    # ── Servidor principal ───────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;  # Para archivos de audio

        # API del backend
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Health check del backend
        location /health {
            proxy_pass http://backend/health;
        }

        # Dashboard Grafana (accesible vía ZeroTier en /grafana/)
        location /grafana/ {
            proxy_pass         http://grafana/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            rewrite ^/grafana/(.*) /$1 break;
        }

        # Raíz → redirect a Grafana
        location / {
            return 302 /grafana/;
        }
    }
}
